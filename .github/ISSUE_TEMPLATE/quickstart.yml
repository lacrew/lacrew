name: Quickstart — I'm stuck
description: Hit an error or got lost following the quickstart or a CLI command
title: "[quickstart] "
labels: ["quickstart"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying LaCrew. Tell us where it stopped and we will help you through it.
        Never paste a private key, seed phrase or API key here.
  - type: input
    id: step
    attributes:
      label: Step or command you reached
      description: The quickstart step, or the `lacrew` command you ran.
      placeholder: lacrew deploy --anvil
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error text
      description: What the terminal printed. Redact secrets.
      render: shell
    validations:
      required: true
  - type: input
    id: cli_version
    attributes:
      label: CLI version
      description: Output of `lacrew version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node version and OS
      placeholder: Node v22.12.0, macOS 14
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
